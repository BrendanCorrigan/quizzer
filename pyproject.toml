[project]
name = "quizzer"
version = "0.1.0"
description = "A python application for displaying a quiz :)"
readme = "README.md"
authors = [
    { name = "Brendan Corrigan", email = "brendancorrigan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
quizzer = "quizzer.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
